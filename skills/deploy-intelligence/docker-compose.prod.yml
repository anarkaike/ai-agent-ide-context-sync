version: '3.8'

services:
  # Laravel+Inertia+Vue Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: production
    container_name: ${COMPOSE_PROJECT_NAME}-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    networks:
      - app-network
    depends_on:
      - db
      - redis
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_DATABASE=clinica
      - DB_USERNAME=clinica
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - CHATWOOT_URL=${CHATWOOT_URL}
      - CHATWOOT_TOKEN=${CHATWOOT_TOKEN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/sites:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./storage/app/public:/var/www/html/storage/app/public:ro
    networks:
      - app-network
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=clinica
      - POSTGRES_USER=clinica
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinica"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Queue Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: production
    container_name: ${COMPOSE_PROJECT_NAME}-worker
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    networks:
      - app-network
    depends_on:
      - db
      - redis
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_DATABASE=clinica
      - DB_USERNAME=clinica
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

  # Laravel Scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: production
    container_name: ${COMPOSE_PROJECT_NAME}-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    networks:
      - app-network
    depends_on:
      - db
      - redis
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_DATABASE=clinica
      - DB_USERNAME=clinica
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"

  # Chatwoot Integration (Optional)
  chatwoot:
    image: chatwoot/chatwoot:latest
    container_name: ${COMPOSE_PROJECT_NAME}-chatwoot
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - FRONTEND_URL=${CHATWOOT_FRONTEND_URL}
      - DATABASE_URL=postgresql://postgres:${CHATWOOT_DB_PASSWORD}@chatwoot-db:5432/chatwoot_production
      - REDIS_URL=redis://chatwoot-redis:6379
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY}
    volumes:
      - chatwoot_storage:/app/storage
    networks:
      - app-network
    depends_on:
      - chatwoot-db
      - chatwoot-redis

  # Chatwoot Database
  chatwoot-db:
    image: postgres:15-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-chatwoot-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=chatwoot_production
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${CHATWOOT_DB_PASSWORD}
    volumes:
      - chatwoot_postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # Chatwoot Redis
  chatwoot-redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-chatwoot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - chatwoot_redis_data:/data
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  chatwoot_storage:
    driver: local
  chatwoot_postgres_data:
    driver: local
  chatwoot_redis_data:
    driver: local

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

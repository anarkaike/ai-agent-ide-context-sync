# Nginx configuration for AlphaClinics environments
# Place this in /etc/nginx/conf.d/alphaclinics.conf

# Upstream for DEV environment
upstream alphaclinics_dev {
    server sistema-clinica-app-working:80;
}

# Upstream for HMG environment  
upstream alphaclinics_hmg {
    server sistema-clinica-app-working:80;
}

# Upstream for PROD environment
upstream alphaclinics_prod {
    server sistema-clinica-app-working:80;
}

# DEV environment
server {
    listen 80;
    server_name dev.alphaclinics.servinder.com.br;
    
    access_log /var/log/nginx/dev.alphaclinics.access.log;
    error_log /var/log/nginx/dev.alphaclinics.error.log;
    
    location / {
        proxy_pass http://alphaclinics_dev;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

